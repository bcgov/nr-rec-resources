# Manually triggered workflow to hotfix deploy to AWS
name: Hotfix Deploy
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Application to deploy'
        required: true
        type: choice
        options:
          - admin
          - public
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-hotfix-branch:
    name: Validate hotfix branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure dispatch is from a hotfix branch
        run: |
          if [[ "${{ github.ref_name }}" != hotfix-* ]]; then
            echo "Branch must start with 'hotfix-'. Current branch: ${{ github.ref_name }}"
            exit 1
          fi

  build-hotfix-image:
    name: Build Hotfix Image
    needs: validate-hotfix-branch
    uses: ./.github/workflows/.build.yml
    secrets: inherit

  # Review gate for prod only — skipped automatically when deploying to test
  review-prod-deployment:
    name: Review hotfix deployment to prod
    needs: build-hotfix-image
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-24.04
    environment: review-${{ inputs.app }}-prod-deployment
    steps:
      - name: Confirm deployment
        run: echo "Deploying hotfix branch '${{ github.ref_name }}' (${{ github.sha }}) to prod"

  hotfix-deploy-to-aws:
    name: Hotfix Deploy to AWS ${{ inputs.environment }}
    needs: [build-hotfix-image, review-prod-deployment]
    # Runs when: deploying to test (review skipped) OR prod review was approved
    if: ${{ always() && needs.build-hotfix-image.result == 'success' && (needs.review-prod-deployment.result == 'success' || needs.review-prod-deployment.result == 'skipped') }}
    uses: ./.github/workflows/.deploy-app.yml
    with:
      app: ${{ inputs.app }}
      app_env: ${{ inputs.environment }}
      command: apply
      environment_name: ${{ inputs.environment }}
      tag: ${{ github.sha }}
    secrets: inherit
