secrets:
  dbHost: ~
  dbName: ~
  dbPassword: ~
  dbUser: ~
  flywayTaskConfigs: ''
  persist: true
image:
  tag: ~
resources:
  requests:
    cpu: 250m
    memory: 1500Mi
schedule: '0 8 * * *' # Daily at midnight PST
hourlySchedule: '15 * * * *' # Hourly on the 15th minute
tenureDailyExportTarget: 'core' # keep daily lightweight; run tenure images via dedicated tenure cronjobs
tenureImageCronEnabled: true # render image-related tenure cronjobs so they are visible
tenureCoreCronEnabled: true # render tenure-core cronjob
tenureWeeklyCronEnabled: true # render weekly tenure cronjob
tenureImageCronSuspend: true # keep image/core tenure cronjobs manual-trigger-only
tenureWeeklyCronSuspend: true # keep weekly tenure cronjob manual-trigger-only
tenureCoreSchedule: '0 1 * * *' # used only when unsuspended/manual trigger from cronjob
tenureAppImageSchedule: '0 2 * * *' # used only when unsuspended/manual trigger from cronjob
tenureMfImageSchedule: '0 3 * * *' # used only when unsuspended/manual trigger from cronjob
tenureWeeklySchedule: '0 3 * * 1' # Weekly on Sunday evening PT (03:00 UTC Monday)
backoffLimit: 3 # retry 3 times before giving up
successHistoryLimit: 7
failedHistoryLimit: 7
config:
  awsS3Bucket: 'rst-fta-lza-dataload-oracle' # default bucket for S3 uploads
pvc:
  size: ~ # Persistent volume claim size, e.g., "2Gi" given via GHA in build-deploy-el-openshift.yml
scratch:
  usePersistentVolume: false
  emptyDirSizeLimit: 20Gi
