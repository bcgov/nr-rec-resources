secrets:
  dbHost: ~
  dbName: ~
  dbPassword: ~
  dbUser: ~
  flywayTaskConfigs: ''
  persist: true
image:
  tag: ~
resources:
  requests:
    cpu: 250m
    memory: 1500Mi
schedule: '0 8 * * *' # Daily at midnight PST
hourlySchedule: '15 * * * *' # Hourly on the 15th minute
tenureAppImageSchedule: '0 0 1 1 *' # Unused when suspended; keep a valid cron expression
tenureMfImageSchedule: '5 0 1 1 *' # Unused when suspended; keep a valid cron expression
tenureCoreSchedule: '10 0 1 1 *' # Unused when suspended; keep a valid cron expression
tenureImageCronSuspend: true # manual trigger only
tenureImageCronEnabled: true
backoffLimit: 3 # retry 3 times before giving up
successHistoryLimit: 7
failedHistoryLimit: 7
config:
  awsS3Bucket: 'rst-fta-lza-dataload-oracle' # default bucket for S3 uploads
pvc:
  size: ~ # Persistent volume claim size, e.g., "2Gi" given via GHA in build-deploy-el-openshift.yml
scratch:
  usePersistentVolume: false
  emptyDirSizeLimit: 20Gi
